*{ box-sizing:border-box; scrollbar-width:none; -ms-overflow-style:none; }
*::-webkit-scrollbar{ display:none; width:0; height:0; }
.topbar{ display:flex; align-items:center; gap:10px; padding:16px 16px 8px; flex-shrink:0; }
.topbar h1{ font-size:calc(15px + var(--kobu-font-boost, 0px)); font-weight:600; margin:0; flex:1; color:var(--k-text); display:flex; align-items:center; gap:7px; }
.topbar-title-icon{ font-size:calc(16px + var(--kobu-font-boost, 0px)); color:var(--k-accent); flex-shrink:0; }
.iconbtn{ background:none; border:none; padding:6px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--k-accent); border-radius:8px; }
.iconbtn:active{ background:var(--k-card2); }
.iconbtn .icon-slot{ font-size:calc(19px + var(--kobu-font-boost, 0px)); }
.icon-slot{ display:inline-flex; align-items:center; justify-content:center; }
.icon-slot svg{ width:1em; height:1em; }
.field{ display:flex; flex-direction:column; gap:5px; }
.field label{ font-size:calc(11px + var(--kobu-font-boost, 0px)); color:var(--k-muted); font-weight:500; }
.input, textarea.input, select.input{
    background:var(--k-card2); border:0.5px solid var(--k-border); border-radius:10px; padding:9px 11px;
    font-size:calc(13px + var(--kobu-font-boost, 0px)); color:var(--k-text); width:100%; outline:none;
  }
.input-mask{ -webkit-text-security:disc; text-security:disc; }
textarea.input{ resize:vertical; min-height:60px; }
.searchbar{ display:flex; align-items:center; gap:8px; background:var(--k-card2); border-radius:10px; padding:9px 11px; }
.searchbar .icon-slot{ font-size:calc(16px + var(--kobu-font-boost, 0px)); color:var(--k-accent); }
.searchbar input{ border:none; background:none; outline:none; font-size:calc(13px + var(--kobu-font-boost, 0px)); color:var(--k-text); flex:1; }
.searchbar input::placeholder{ color:var(--k-muted); }
.chiprow{ display:flex; gap:6px; flex-wrap:wrap; }
.chip{ background:var(--k-card2); color:var(--k-accent); font-size:calc(10px + var(--kobu-font-boost, 0px)); padding:4px 10px; border-radius:20px; border:none; cursor:pointer; }
.chip.active{ background:var(--k-accent); color:var(--k-bg); }
.chip.removable{ display:flex; align-items:center; gap:4px; }
.chip.removable .icon-slot{ font-size:calc(11px + var(--kobu-font-boost, 0px)); cursor:pointer; }
.btn{ border:none; border-radius:10px; padding:10px; font-size:calc(12.5px + var(--kobu-font-boost, 0px)); cursor:pointer; text-align:center; }
.btn-primary{ background:var(--k-accent); color:var(--k-bg); font-weight:600; }
.btn-ghost{ background:none; border:0.5px solid var(--k-border); color:var(--k-text); }
.btn-danger{ background:none; border:0.5px solid var(--k-danger); color:var(--k-danger); }
.btn-row{ display:flex; gap:8px; }
.btn-row .btn{ flex:1; }
.section-title{ font-size:calc(12px + var(--kobu-font-boost, 0px)); font-weight:600; color:var(--k-text); margin:4px 0 8px; display:flex; align-items:center; justify-content:space-between; }
.grp-card{ background:var(--k-card); border-radius:14px; border:0.5px solid var(--k-border); padding:14px; display:flex; flex-direction:column; gap:10px; }
.grp-card .section-title{ margin:0; justify-content:flex-start; gap:8px; }
.grp-card .badge-ic{ width:26px; height:26px; border-radius:8px; background:var(--k-card2); color:var(--k-accent); display:flex; align-items:center; justify-content:center; font-size:calc(14px + var(--kobu-font-boost, 0px)); flex-shrink:0; }
.grp-card .badge-ic .icon-slot{ font-size:calc(14px + var(--kobu-font-boost, 0px)); }
.grp-card--action{ background:var(--k-card2); border-color:var(--k-accent); }
.grp-card--action .badge-ic{ background:var(--k-accent); color:var(--k-bg); }
.grp-card--action .input{ background:var(--k-card); }
.grp-card--action .rs-box{ background:var(--k-card); }
.grp-card--new .badge-ic{ background:var(--k-accent); color:var(--k-bg); }
.grp-card--danger{ background:var(--k-status-pend-bg); border-color:var(--k-danger); }
.grp-card--danger .badge-ic{ background:var(--k-danger); color:var(--k-bg); }
.addbtn{ display:flex; align-items:center; justify-content:center; gap:6px; background:var(--k-accent); color:var(--k-bg); border:none; border-radius:12px; padding:11px; font-size:calc(13px + var(--kobu-font-boost, 0px)); font-weight:600; cursor:pointer; }
.switch{ width:34px; height:19px; border-radius:20px; background:var(--k-border); position:relative; cursor:pointer; flex-shrink:0; }
.switch .knob-sw{ width:15px; height:15px; border-radius:50%; background:var(--k-card); position:absolute; top:2px; left:2px; transition:left .15s; }
.switch.on{ background:var(--k-accent); }
.switch.on .knob-sw{ left:17px; }
.rowline{ display:flex; align-items:center; justify-content:space-between; min-height:44px; padding:0; border-bottom:0.5px solid var(--k-border); }
.rowline:last-child{ border-bottom:none; }
.rowline .l{ font-size:calc(12.5px + var(--kobu-font-boost, 0px)); color:var(--k-text); }
.settings-tile{ background:var(--k-card); border:0.5px solid var(--k-border); border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:12px 4px; cursor:pointer; }
.settings-tile .icon-slot{ font-size:calc(19px + var(--kobu-font-boost, 0px)); color:var(--k-accent); }
.settings-tile span{ font-size:calc(10px + var(--kobu-font-boost, 0px)); text-align:center; color:var(--k-text); }
.ut-add-row{ display:flex; align-items:center; justify-content:center; gap:6px; width:100%; background:none; border:1.5px dashed var(--k-border); border-radius:10px; padding:10px; cursor:pointer; color:var(--k-accent); font-size:calc(12px + var(--kobu-font-boost, 0px)); font-family:inherit; }
.ut-add-row .icon-slot{ font-size:calc(16px + var(--kobu-font-boost, 0px)); }
.home-tile-card{ display:flex; border:0.5px solid var(--k-border); border-radius:12px; overflow:hidden; }
.home-tile{ flex:1; padding:14px 8px; text-align:center; cursor:pointer; background:var(--k-bg); transition:background .2s ease; }
.home-tile-divider{ width:0.5px; background:var(--k-border); }
.home-tile-icon{ font-size:calc(22px + var(--kobu-font-boost, 0px)); color:var(--k-border); transition:color .2s ease, transform .3s ease; display:inline-block; }
.home-tile-label{ margin:6px 0 0; font-size:calc(12.5px + var(--kobu-font-boost, 0px)); font-weight:500; color:var(--k-muted); transition:color .2s ease; }
.home-tile.active{ background:var(--k-card2); }
.home-tile.active .home-tile-icon{ color:var(--k-accent); }
.home-tile.active .home-tile-label{ color:var(--k-text); }
@keyframes homeTileBounce{ 0%{ transform:scale(1); } 50%{ transform:scale(1.25); } 100%{ transform:scale(1); } }
  /* ===== Base del editor ===== */
  [hidden]{ display:none !important; }
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
  html, body{ margin:0; padding:0; height:100%; background:var(--k-bg); font-family:var(--font-sans); color:var(--k-text); -webkit-text-size-adjust:100%; }
  button, input, select, textarea{ font-family:var(--font-sans); }
  button{ transition:transform .08s ease; }
  button:active{ transform:scale(0.96); }
  #app{ position:relative; height:100vh; height:100dvh; display:flex; overflow:hidden; background:var(--k-bg); }
  .ew-stage{ position:relative; flex:1; min-width:0; height:100%; overflow:hidden; }
  .ew-page{ position:absolute; inset:0; display:flex; flex-direction:column; background-color:var(--k-bg); background-image:var(--k-bg-pattern); background-size:160px 160px;
    transition:transform .34s cubic-bezier(.2,.8,.25,1), opacity .34s ease; will-change:transform; }
  .ew-page.off-right{ transform:translateX(100%); visibility:hidden; transition:transform .34s cubic-bezier(.2,.8,.25,1), visibility 0s linear .34s; }
  .ew-page.behind{ transform:translateX(-22%); opacity:.55; pointer-events:none; }
  .ew-scroll{ flex:1; min-height:0; overflow-y:auto; overscroll-behavior-y:contain; padding:6px 16px 120px; display:flex; flex-direction:column; gap:12px; -webkit-overflow-scrolling:touch; }
  .ew-scroll > *{ flex-shrink:0; }
  .topbar h1{ min-width:0; }
  .topbar h1 .tt{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .iconbtn[disabled]{ opacity:.3; pointer-events:none; }
  .iconbtn svg{ width:19px; height:19px; }

  /* Estado de publicación */
  .ew-status{ display:flex; align-items:center; gap:12px; border-radius:14px; padding:11px 13px; border:0.5px solid transparent; transition:background .35s ease, color .35s ease, border-color .35s ease; }
  .ew-status .ic{ width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex:none; font-size:18px; background:rgba(255,255,255,.5); }
  .ew-status b{ display:block; font-size:calc(13.5px + var(--kobu-font-boost, 0px)); }
  .ew-status small{ display:block; font-size:calc(11.5px + var(--kobu-font-boost, 0px)); opacity:.88; margin-top:1px; line-height:1.35; }
  .ew-status.ok{ background:var(--k-success-bg); color:var(--k-success); border-color:color-mix(in srgb, var(--k-success) 25%, transparent); }
  .ew-status.pend{ background:var(--k-warning-bg); color:var(--k-warning); border-color:color-mix(in srgb, var(--k-warning) 25%, transparent); }
  .ew-status.err{ background:var(--k-danger-bg); color:var(--k-danger); border-color:color-mix(in srgb, var(--k-danger) 25%, transparent); }
  .ew-status.load{ background:var(--k-card); color:var(--k-muted); border-color:var(--k-border); }
  .ew-status .act{ margin-left:auto; flex:none; }
  .ew-prueba{ display:flex; gap:8px; align-items:center; font-size:calc(11.5px + var(--kobu-font-boost, 0px)); color:var(--k-info); background:var(--k-info-bg); border-radius:12px; padding:8px 11px; }

  /* Secciones */
  .ew-sec{ background:var(--k-card); border:0.5px solid var(--k-border); border-radius:14px; overflow:hidden; }
  .ew-sec-h{ display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; user-select:none; }
  .ew-sec-h .badge-ic{ width:30px; height:30px; border-radius:9px; background:var(--k-card2); color:var(--k-accent); display:flex; align-items:center; justify-content:center; font-size:16px; flex:none; }
  .ew-sec-h .tt{ flex:1; min-width:0; }
  .ew-sec-h .tt b{ display:block; font-size:calc(14px + var(--kobu-font-boost, 0px)); color:var(--k-text); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ew-sec-h .tt small{ font-size:calc(11px + var(--kobu-font-boost, 0px)); color:var(--k-muted); }
  .ew-sec-h .chev{ color:var(--k-muted); font-size:16px; transition:transform .3s ease; }
  .ew-sec.open .ew-sec-h .chev{ transform:rotate(90deg); }
  .ew-sec-b{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .32s cubic-bezier(.2,.8,.25,1); }
  .ew-sec.open .ew-sec-b{ grid-template-rows:1fr; }
  .ew-sec-b > div{ overflow:hidden; }
  .ew-row{ display:flex; align-items:center; gap:10px; padding:11px 14px; border-top:0.5px solid var(--k-border); cursor:pointer; transition:background .25s ease; }
  .ew-row:active{ background:var(--k-card2); }
  .ew-row .n{ flex:1; min-width:0; }
  .ew-row .n b{ display:block; font-size:calc(13.5px + var(--kobu-font-boost, 0px)); font-weight:500; color:var(--k-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ew-row .n small{ display:block; font-size:calc(11px + var(--kobu-font-boost, 0px)); color:var(--k-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
  .ew-row .p{ font-size:calc(13.5px + var(--kobu-font-boost, 0px)); font-weight:600; color:var(--k-text); font-variant-numeric:tabular-nums; white-space:nowrap; text-align:right; }
  .ew-row .p s{ display:block; font-size:calc(10.5px + var(--kobu-font-boost, 0px)); color:var(--k-muted); font-weight:400; }
  .ew-row .p.warn{ color:var(--k-danger); font-weight:500; }
  .ew-row .p.ask{ color:var(--k-muted); font-weight:500; }
  .ew-row .go{ color:var(--k-border); font-size:15px; }
  .ew-row.off .n b{ text-decoration:line-through; color:var(--k-muted); }
  .ew-row.bad .n b{ color:var(--k-danger); }
  .ew-row.flash{ animation:ewFlash 1.4s ease; }
  @keyframes ewFlash{ 0%,40%{ background:var(--k-warning-bg); } 100%{ background:transparent; } }
  .ew-tag{ font-size:calc(9.5px + var(--kobu-font-boost, 0px)); font-weight:700; letter-spacing:.04em; text-transform:uppercase; border-radius:20px; padding:3px 8px; white-space:nowrap; flex:none; }
  .ew-tag.ag{ background:var(--k-danger-bg); color:var(--k-danger); }
  .ew-tag.nu{ background:var(--k-warning-bg); color:var(--k-warning); }
  .ew-tag.ed{ background:var(--k-info-bg); color:var(--k-info); }
  .ew-tag.pct{ background:var(--k-success-bg); color:var(--k-success); }
  .ew-addrow{ display:flex; align-items:center; justify-content:center; gap:6px; padding:12px; border-top:0.5px solid var(--k-border); color:var(--k-accent); font-size:calc(12.5px + var(--kobu-font-boost, 0px)); font-weight:600; cursor:pointer; background:none; border-left:0; border-right:0; border-bottom:0; width:100%; }
  .ew-sec-foot{ display:flex; border-top:0.5px solid var(--k-border); }
  .ew-sec-foot .ew-addrow{ border-top:0; flex:1; }
  .ew-sec-foot .ew-addrow + .ew-addrow{ border-left:0.5px solid var(--k-border); color:var(--k-muted); }
  .ew-empty{ text-align:center; color:var(--k-muted); font-size:calc(12.5px + var(--kobu-font-boost, 0px)); padding:18px 10px; }

  /* Barra inferior */
  .ew-bar{ position:absolute; left:0; right:0; bottom:0; padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px)); display:flex; gap:10px;
    background:linear-gradient(180deg, color-mix(in srgb, var(--k-bg) 0%, transparent), var(--k-bg) 38%); z-index:5; }
  .ew-bar .btn{ flex:1; display:flex; align-items:center; justify-content:center; gap:7px; padding:13px 10px; border-radius:14px; font-size:calc(13.5px + var(--kobu-font-boost, 0px)); font-weight:600; }
  .ew-bar .btn-ghost{ background:var(--k-card); }
  .ew-bar .btn-primary{ flex:1.35; box-shadow:0 6px 16px -6px color-mix(in srgb, var(--k-accent) 70%, transparent); }
  .ew-bar .btn .icon-slot, .ew-bar .btn svg{ font-size:17px; width:17px; height:17px; }
  .ew-count{ background:var(--k-bg); color:var(--k-accent); border-radius:20px; min-width:20px; height:20px; padding:0 6px; display:inline-flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; }
  .ew-count.pop{ animation:ewPop .4s ease; }
  @keyframes ewPop{ 0%{ transform:scale(1); } 45%{ transform:scale(1.45); } 100%{ transform:scale(1); } }
  .btn-primary[disabled]{ opacity:.45; box-shadow:none; pointer-events:none; }

  /* Formularios */
  .ew-form{ display:flex; flex-direction:column; gap:12px; }
  .ew-card{ background:var(--k-card); border:0.5px solid var(--k-border); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:12px; }
  .ew-card > .section-title{ margin:0; justify-content:flex-start; gap:8px; }
  .ew-card > .section-title .badge-ic{ width:26px; height:26px; border-radius:8px; background:var(--k-card2); color:var(--k-accent); display:flex; align-items:center; justify-content:center; font-size:14px; flex:none; }

<body>
<div id="app">
  <div class="ew-stage" id="stage">

    <!-- Principal -->

<script>

function parseWeb(txt, nombre){

function migrarMayo(m){

  const P = m.precios || {}, hay = Object.keys(P).some(k => numP(P[k]));
  const categorias = data.categorias.map(c => ({
    id: c.id, titulo: c.titulo || c.pestana, ...(c.cursiva ? { cursiva: c.cursiva } : {}), ...(c.nota && !/pedido/i.test(c.nota) ? { nota: c.nota } : {}), ...(c.oscuro ? { oscuro: true } : {}),
    productos: c.productos.map(p => {

      if (p.variantes && p.variantes.length){
        const vs = p.variantes.filter(v => !hay || numP(P[`${p.id}.${v.id}`])).map(v => ({ id: v.id, nombre: v.nombre, ...(v.detalle ? { detalle: v.detalle } : {}), precio: numP(P[`${p.id}.${v.id}`]) || "", precioPublico: v.precio }));

function limpiarMayo(m){
  const limpio = o => { const r = {}; Object.keys(o).forEach(k => { const v = o[k]; if (v === "" || v == null || v === false) return; if ((k === "precio" || k === "precioPublico") && !(+v > 0)) return; r[k] = v; }); return r; };

function errMsg(e){

  if (/no tiene permiso/.test(m)) return "El token de GitHub no tiene permiso para el repo de la web. Revisá que tenga Contents: Read and write.";
  if (/clave incorrecta/.test(m)) return "La clave de sincronización no es correcta. Revisala en Kobu → Ajustes → Avanzado.";
  if (/clave corta/.test(m)) return "Para publicar la web, la clave de la cuenta principal tiene que ser más larga (por seguridad). Cambiala en el script y en Kobu.";
  if (/demasiados intentos/.test(m)) return "Hubo muchos intentos seguidos. Esperá un minuto y probá de nuevo.";
  if (/acción desconocida/.test(m)) return "El script de Google no está actualizado. Pegá la versión nueva y hacé una nueva implementación.";
  if (/ocupado/.test(m)) return "El script estaba ocupado. Probá de nuevo en unos segundos.";
  if (/datos inválidos|demasiado grandes|imagen inválida/.test(m)) return "El script rechazó los datos (" + m + ").";

    else if (p.variantes){ if (p.variantes.some(v => !(v.precio >= 0) || v.precio === "" || v.precio == null || !String(v.nombre || "").trim())) bad.push(p.id); }

function getRef(path){ let o = data; if (path.startsWith("m:")){ o = mayo; path = path.slice(2); } const ks = path.split("."); for (let i = 0; i < ks.length - 1; i++){ const k = isNaN(ks[i]) ? ks[i] : +ks[i]; if (o[k] == null) o[k] = {}; o = o[k]; } return [o, ks[ks.length - 1]]; }
function setPath(path, value){ const [o, k] = getRef(path); if (value === "" || value === false || value === null || value === undefined){ delete o[k]; } else o[k] = value; }
function getPath(path){ const [o, k] = getRef(path); return o[k]; }

document.addEventListener("input", e => {
  const el = e.target; if (!data) return;
  if (el.id === "search"){ search = el.value; renderSecsOnly(); return; }
  if (el.id === "mPct"){ store.set("kobuWebPct", +el.value || 20); return; }
  if (el.dataset.mfield){ mayo[el.dataset.mfield] = el.value; commit({ typing: true }); return; }
  if (el.dataset.lines){ const [o, k] = getRef(el.dataset.lines); o[k] = el.value.split("\n").map(s => s.trim()).filter(Boolean); commit({ typing: true }); return; }
  const path = el.dataset.path; if (!path) return;
  const isM = path.startsWith("m:");
  let v = el.value;
  if (el.type === "number"){
    if (isM && /\.(precio|precioPublico)$/.test(path)){
      v = el.value === "" ? "" : Math.max(0, Math.round(+el.value));
      setPath(path, v === 0 ? "" : v);
      if (path.endsWith(".precio")) mayo.actualizado = hoy();
      const bp = path.replace(/\.(precio|precioPublico)$/, ""), o = getPath(bp) || {}, pc = document.querySelector(`[data-pct="${CSS.escape(bp)}"]`); if (pc) pc.textContent = pctTxt(+o.precioPublico, +o.precio);
      commit({ typing: true }); return;
    }
    if (v === ""){ const [o, k] = getRef(path); o[k] = ""; el.classList.add("bad"); commit({ typing: true }); return; }
    v = Math.max(0, Math.round(+v)); el.classList.remove("bad");
    if (path === "negocio.horaDeCorte") v = Math.min(23, v);
    if (/\.precio$/.test(path)){ const orig = sub && sub.kind === "prod" && pub ? prodMap(pub.data)[sub.id] : null; el.classList.toggle("changed", !!(orig && !orig.variantes && /productos\.\d+\.precio$/.test(path) && +orig.precio !== v)); }
  }
  if (el.type === "color") v = v.toUpperCase();
  if (path.endsWith(".nombre")){ el.classList.toggle("bad", !v.trim()); const [o, k] = getRef(path); o[k] = v; if (sub && sub.kind === "prod" && /productos\.\d+\.nombre$/.test(path)) $("#subTitle").textContent = v || "Producto"; }
  else setPath(path, v);
  if (el.tagName === "SELECT"){ commit({ render: true }); return; }
  commit({ typing: true });
});

async function cargar(sinBorrador){
  const f = $("#full"); f.classList.remove("hide"); f.innerHTML = '<span class="ew-spin dark"></span><b>Cargando la web…</b>';
  if (!SYNC_URL || !SYNC_KEY){ fullMsg("lock", "Abrilo desde Kobu", "Este editor usa la conexión de la app. Abrí Kobu en este mismo navegador, configurá la sincronización (Ajustes → Avanzado) y entrá desde Ajustes → Editar la web.", '<button class="btn btn-primary" onclick="location.href=\'./\'">Ir a Kobu</button>'); return; }
  let L;
  try { L = await api("webLeer"); } catch (e){ L = { error: e.message }; }
  if (!L || !L.ok){ fullMsg("cloud", "No se pudo abrir la web", esc(errMsg(L)), '<button class="btn btn-primary" id="retry">Reintentar</button>'); $("#retry").onclick = () => cargar(); return; }
  const d = parseWeb(L.datos && L.datos.text, "KOBU");
  if (!d){ fullMsg("alert-triangle", "No se pudo leer datos.js", "El archivo publicado tiene un formato que el editor no entiende. Si lo editaste a mano, revisá que no falte una coma o una comilla."); return; }
  RAMA = L.rama; PRUEBA = !!L.prueba; WEB = String(L.web || "https://j4mp3.github.io/kobudulce/");
  base = { commit: L.commit, datos: L.datos.sha, mayorista: (L.mayorista && L.mayorista.sha) || "" };
  data = d; normalize();
  const m = parseWeb(L.mayorista && L.mayorista.text, "KOBU_MAYORISTA");
  mayo = m ? migrarMayo(m) : { actualizado: "", categorias: [] }; normalize();
  pub = { data: clone(data), mayo: clone(mayo) };
  // Borrador guardado: se retoma si es de la misma cuenta.
  const br = sinBorrador ? null : store.get(LS_BORRADOR);
  let aviso = "";
  if (br && br.rama === RAMA && br.data){
    if (br.base && br.base.datos === base.datos && br.base.mayorista === base.mayorista){ data = br.data; mayo = br.mayo; normalize(); aviso = "Seguís con tus cambios sin publicar."; }
    else { data = br.data; mayo = br.mayo; normalize(); pub = br.pub || pub; base = br.base || base; aviso = "Ojo: se publicó algo nuevo desde que empezaste. Al publicar te va a avisar."; }
  } else if (br && br.rama !== RAMA) store.del(LS_BORRADOR);
  history = []; future = []; prevSnap = snap();
  $("#pruebaNote").hidden = !PRUEBA;
  setPvPage("menu"); setPvSize(false);
  renderPane(); updStatus();
  f.classList.add("hide"); setTimeout(() => { if (f.classList.contains("hide")) f.innerHTML = ""; }, 400);
  if (aviso) setTimeout(() => toast(aviso), 500);
}

$("#goApp").onclick = () => { saveDraftNow(); location.href = "./"; };
$("#undoBtn").onclick = undo; $("#redoBtn").onclick = redo;
$("#btnPub").onclick = openPublish; $("#prevPub").onclick = () => { backFromPrev(); setTimeout(openPublish, 200); };
$("#btnPrev").onclick = () => go("prev"); $("#prodPrev").onclick = () => go("prev");
$("#prevBack").onclick = backFromPrev; $("#prevEdit").onclick = backFromPrev;
$("#subBack").onclick = closeSub; $("#subOk").onclick = closeSub;
addEventListener("keydown", e => {
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && k === "z" && !e.shiftKey){ if (!/INPUT|TEXTAREA/.test(document.activeElement.tagName) || typing){ e.preventDefault(); undo(); } }
  else if (mod && (k === "y" || (k === "z" && e.shiftKey))){ e.preventDefault(); redo(); }
  else if (k === "escape"){ if ($("#ov").classList.contains("on")) closeSheet(); else if (!$("#pPrev").classList.contains("off-right")) backFromPrev(); else if (sub) closeSub(); }
});
mountIcons();
cargar();
</script>
</body>
</html>
